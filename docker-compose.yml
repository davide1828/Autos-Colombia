services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parqueadero
    ports: ["${PGPORT:-5433}:5432"]
    volumes:
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parqueadero"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]          # docker compose --profile app up --build
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/parqueadero?sslmode=disable
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN (mínimo 16 caracteres)}
    ports: ["8080:8080"]
